attributes = "#8D9497"
constant = "#969B99"
"constant.character.escape" = "#969B99"
"constant.numeric" = "#969B99"
constructor = "#7D9078"
debug = "#D8DDD4"
"diff.delta" = "#A1A69E"
"diff.minus" = "#676D70"
"diff.plus" = "#9FB297"
error = "#676D70"
function = "#9FB297"
hint = "#969B99"
info = "#8D9497"
keyword = "#676D70"
label = "#969B99"
"markup.heading" = "#A1A69E"
"markup.link.text" = "#676D70"
"markup.list" = "#D8DDD4"
"markup.quote" = "#3B4042" 
"markup.raw" = "#C0C5BC" 
namespace = "#8D9497"
operator = "#676D70"
special = "#C0C5BC" 
string = "#A1A69E"
type = "#8D9497"
"ui.text" = "#D8DDD4"
"ui.text.focus" = "#D8DDD4"
variable = "#D8DDD4"
"variable.other.member" = "#676D70"
warning = "#C0C5BC" 

# Modifiers for syntax elements
[comment]
fg = "#3B4042"
modifiers = ["italic"]

[diagnostic]
modifiers = ["underlined"]

["diagnostic.error".underline]
style = "curl"

["diagnostic.hint".underline]
style = "curl"

["diagnostic.info".underline]
style = "curl"

["diagnostic.warning".underline]
style = "curl"

# Markup styling
["markup.bold"]
fg = "#A1A69E"
modifiers = ["bold"]

["markup.italic"]
fg = "#969B99"
modifiers = ["italic"]

["markup.link.url"]
fg = "#9FB297"
modifiers = ["underlined"]

["markup.strikethrough"]
modifiers = ["crossed_out"]

# UI elements
["ui.background"]
fg = "#D8DDD4"
bg = "#1B1D1F"

["ui.bufferline"]
bg = "#1B1D1F"
fg = "#3B4042"

["ui.bufferline.active"]
bg = "#1B1D1F"
fg = "#A1A69E"
modifiers = ["bold"]

["ui.bufferline.modified"]
bg = "#1B1D1F"
fg = "#A1A69E"

["ui.cursor"]
fg = "#D8DDD4"
