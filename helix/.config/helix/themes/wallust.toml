constructor = "#A7C080"
debug = "#D3C6AA"
"diff.delta" = "#DBBC7F"
"diff.minus" = "#E67E80"
"diff.plus" = "#8DA101"
error = "#E67E80"
function = "#8DA101"
hint = "#D699B6"
info = "#7FBBB3"
keyword = "#E67E80"
label = "#D699B6"
"markup.heading" = "#DBBC7F"
"markup.link.text" = "#E67E80"
"markup.list" = "#D3C6AA"
