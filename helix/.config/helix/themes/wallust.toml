"variable.other.member" = "#E67E80"
warning = "#DFA000"

# Modifiers for syntax elements
[comment]
fg = "#5C6A72"
modifiers = ["italic"]

[diagnostic]
modifiers = ["underlined"]

["diagnostic.error".underline]
style = "curl"

["diagnostic.hint".underline]
style = "curl"

["diagnostic.info".underline]
style = "curl"

["diagnostic.warning".underline]
style = "curl"

# Markup styling
["markup.bold"]
fg = "#DBBC7F"
modifiers = ["bold"]

["markup.italic"]
fg = "#D699B6"
modifiers = ["italic"]

["markup.link.url"]
fg = "#8DA101"
modifiers = ["underlined"]

["markup.strikethrough"]
modifiers = ["crossed_out"]

# UI elements
["ui.background"]
fg = "#D3C6AA"
