[settings]
experimental = true

[env]
EDITOR = "hx"
COLORTERM = "truecolor"
SOPS_AGE_KEY_FILE = "{{ xdg_config_home }}/sops/age/keys.txt"

[tools]
doppler = "latest"
dyff = "latest"
"forgejo:explosion-mental/wallust" = "latest"
"github:aome510/spotify-player" = "0.25.1"
"github:dalance/amber" = "latest"
"github:neurocyte/flow" = "latest"
"github:square/certigo" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
grok = { version = "latest", bin = "grok", platforms = { windows-arm64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-aarch64.exe" }, windows-x64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-x86_64.exe" } }, url = 'https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-{{ os() }}-{{ arch(x64="x86_64", arm64="aarch64") }}', version_list_url = "https://x.ai/cli/stable" }
helm = "latest"
herdr = "latest"
krew = "latest"
kubecolor = "latest"
"npm:oxfmt" = "latest"
talosctl = "latest"
usage = "latest"
